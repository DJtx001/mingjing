<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<title>明镜 · 要素式受理 Agent</title>
<script src="/vendor/vue.global.js"></script>
<link rel="stylesheet" href="/vendor/element-plus.css">
<script src="/vendor/element-plus.js"></script>
<style>
  :root { --primary: #2b5fad; }
  * { box-sizing: border-box; }
  body { margin: 0; font-size: 13px; background: #f5f7fa; font-family: "Microsoft YaHei", sans-serif; }
  .layout { display: flex; flex-direction: column; height: 100vh; }
  .topbar { height: 48px; background: #fff; border-bottom: 1px solid #e4e7ed; display: flex; align-items: center; padding: 0 20px; }
  .topbar .brand { font-size: 15px; font-weight: 600; flex: 1; }
  .topbar .user { color: #606266; }
  .body { flex: 1; display: flex; overflow: hidden; }
  .sidebar { width: 200px; background: #fff; border-right: 1px solid #e4e7ed; padding: 8px 0; }
  .menu-item { padding: 11px 16px; cursor: pointer; display: flex; align-items: center; gap: 8px; color: #303133; }
  .menu-item:hover { background: #f0f5fc; }
  .menu-item.active { color: var(--primary); background: #eaf1fa; border-right: 3px solid var(--primary); font-weight: 600; }
  .menu-item .badge { margin-left: auto; }
  .content { flex: 1; padding: 16px 20px; overflow: auto; }
  .card { background: #fff; border-radius: 6px; padding: 16px; }
  /* AI 助手悬浮按钮（页⑥ 全局组件） */
  .ai-fab { position: fixed; right: 24px; bottom: 24px; z-index: 1000; }
  /* 抽屉内对话 */
  .drawer-alert { margin-bottom: 12px; }
  .chat-list { display: flex; flex-direction: column; gap: 14px; padding: 4px 0 12px; }
  .msg { display: flex; flex-direction: column; gap: 6px; }
  .msg.user { align-items: flex-end; }
  .bubble { padding: 10px 14px; border-radius: 6px; line-height: 1.7; white-space: pre-wrap; word-break: break-word; max-width: 100%; }
  .msg.user .bubble { background: var(--primary); color: #fff; }
  .msg.assistant .bubble { background: #f5f7fa; border: 1px solid #e4e7ed; }
  .cite-card { background: #f0f5fc; border-left: 3px solid var(--primary); padding: 8px 10px; border-radius: 0 6px 6px 0; font-size: 12px; color: #4a5b76; display: flex; flex-direction: column; gap: 4px; }
  .cite-card .actions { display: flex; gap: 8px; }
  .quick-qs { display: flex; flex-wrap: wrap; gap: 6px; margin-bottom: 10px; }
  .streaming::after { content: '▌'; animation: blink 1s infinite; }
  @keyframes blink { 50% { opacity: 0; } }
  .el-button--primary { --el-button-bg-color: var(--primary); --el-button-border-color: var(--primary); }
</style>
</head>
<body>
<div id="app">
  <div class="layout">
    <!-- 顶栏 -->
    <header class="topbar">
      <div class="brand">⚖ 要素式受理 Agent</div>
      <div class="user">受理员 张明 · 诉调对接中心</div>
    </header>
    <div class="body">
      <!-- 左侧菜单（原型图页⑦） -->
      <aside class="sidebar">
        <div class="menu-item active">📂 我的案件 <el-badge class="badge" :value="counts.all" type="primary"></el-badge></div>
        <div class="menu-item">📝 新建受理</div>
        <div class="menu-item">⏳ 待签发文书 <el-badge class="badge" :value="counts.documents_ready" type="warning"></el-badge></div>
        <div class="menu-item">🧐 复核队列 <el-badge class="badge" :value="counts.pending_review" type="danger"></el-badge></div>
        <div class="menu-item">📊 统计看板</div>
        <div class="menu-item">⚙️ 知识库与规则</div>
      </aside>
      <!-- 案件列表 -->
      <main class="content">
        <div class="card">
          <el-tabs v-model="tab" @tab-change="load">
            <el-tab-pane :label="'全部 ' + counts.all" name="all"></el-tab-pane>
            <el-tab-pane :label="'草稿 ' + counts.draft" name="draft"></el-tab-pane>
            <el-tab-pane :label="'要素确认中 ' + counts.awaiting_confirmation" name="awaiting_confirmation"></el-tab-pane>
            <el-tab-pane :label="'待复核 ' + counts.pending_review" name="pending_review"></el-tab-pane>
            <el-tab-pane :label="'待签发 ' + counts.documents_ready" name="documents_ready"></el-tab-pane>
            <el-tab-pane :label="'已结案 ' + counts.completed" name="completed"></el-tab-pane>
          </el-tabs>
          <el-table :data="cases" size="small" stripe v-loading="loading">
            <el-table-column prop="case_id" label="案件编号" width="150"></el-table-column>
            <el-table-column prop="dispute_type" label="纠纷类型" width="100"></el-table-column>
            <el-table-column prop="applicant_name" label="当事人" min-width="150"></el-table-column>
            <el-table-column prop="status_label" label="当前节点" min-width="150"></el-table-column>
            <el-table-column label="核验分流" width="110">
              <template #default="{row}">
                <el-tag v-if="row.triage === 'pass'" type="success" size="small">pass · 通过</el-tag>
                <el-tag v-else-if="row.triage === 'review'" type="warning" size="small">review · 复核</el-tag>
                <el-tag v-else-if="row.triage === 'reject'" type="danger" size="small">reject · 拒绝</el-tag>
                <span v-else>—</span>
              </template>
            </el-table-column>
            <el-table-column label="更新时间" width="150">
              <template #default="{row}">{{ row.updated_at.slice(5, 16).replace('T', ' ') }}</template>
            </el-table-column>
            <el-table-column label="操作" width="110">
              <template #default="{row}">
                <el-button v-if="row.status === 'decline_pending'" type="danger" size="small">人工确认</el-button>
                <el-button v-else-if="row.status === 'completed'" link type="primary" size="small">查看档案</el-button>
                <el-button v-else link type="primary" size="small">继续处理</el-button>
              </template>
            </el-table-column>
          </el-table>
        </div>
      </main>
    </div>
  </div>

  <!-- 页⑥ AI 助手：右下角悬浮按钮（全局组件，无独立路由） -->
  <div class="ai-fab">
    <el-button type="primary" size="large" circle style="width:52px;height:52px;font-size:22px" @click="drawer = true">💬</el-button>
  </div>
  <el-drawer v-model="drawer" size="440px" :with-header="false">
    <div style="display:flex;flex-direction:column;height:100%">
      <div style="font-weight:600;font-size:14px;margin-bottom:8px">
        🤖 AI 助手
        <el-tag v-if="caseId" size="small" type="success" style="margin-left:6px">案件 {{ caseId }} 上下文已注入</el-tag>
      </div>
      <el-alert class="drawer-alert" type="info" :closable="false"
        title="本助手基于当前案件要素与知识库检索回答，所有引用可溯源；回答不构成法律意见，以受理员判断为准。"></el-alert>
      <div class="chat-list" ref="chatList" style="flex:1;overflow:auto">
        <div v-if="!messages.length" style="color:#909399;text-align:center;margin-top:40px">
          受理工位随问随答，知识库未覆盖时会明确告知「暂无依据」
        </div>
        <div v-for="(m, i) in messages" :key="i" class="msg" :class="m.role">
          <div class="bubble" :class="{streaming: m.streaming}">{{ m.content }}</div>
          <div v-for="(c, j) in m.citations" :key="j" class="cite-card">
            <div>{{ c.citation_type === 'law' ? '📜' : '📖' }} {{ c.title }}</div>
            <div class="actions">
              <el-button link type="primary" size="small">↗ 查看原文</el-button>
              <el-button v-if="caseId" link type="success" size="small" @click="adopt(m, c)">✅ 采纳到本案</el-button>
            </div>
          </div>
        </div>
      </div>
      <div class="quick-qs">
        <el-tag v-for="q in quickQuestions" :key="q" style="cursor:pointer" @click="input = q">{{ q }}</el-tag>
      </div>
      <div style="display:flex;gap:8px">
        <el-input v-model="input" placeholder="输入问题，Enter 发送" @keyup.enter="send" :disabled="sending"></el-input>
        <el-button type="primary" @click="send" :loading="sending">发送</el-button>
      </div>
    </div>
  </el-drawer>
</div>
<script>
const { createApp } = Vue;
createApp({
  data() {
    return {
      loading: false, cases: [], tab: 'all',
      counts: { all: 0, draft: 0, awaiting_confirmation: 0, pending_review: 0, documents_ready: 0, completed: 0 },
      // AI 助手（页⑥）
      drawer: false, sessionId: null, caseId: null, messages: [], input: '', sending: false,
      quickQuestions: ['催讨的诉讼时效从什么时候起算？', '这种情况能申请司法确认吗？', '生成一份要素补充询问清单'],
    };
  },
  methods: {
    async load() {
      this.loading = true;
      try {
        const status = this.tab === 'all' ? '' : this.tab;
        const res = await fetch('http://localhost:8000/cases?status=' + status + '&page_size=20');
        this.cases = (await res.json()).items;
      } finally { this.loading = false; }
    },
    async loadCounts() {
      const res = await fetch('http://localhost:8000/cases?page_size=100');
      const all = (await res.json()).items;
      this.counts.all = all.length;
      for (const c of all) {
        if (this.counts[c.status] !== undefined) this.counts[c.status]++;
      }
    },
    // H1 对话：POST + SSE（EventSource 不支持 POST，用 fetch 流解析）
    async send() {
      const text = this.input.trim();
      if (!text || this.sending) return;
      this.input = '';
      this.messages.push({ role: 'user', content: text });
      const aiMsg = { role: 'assistant', content: '', streaming: true, citations: [], reply_id: null };
      this.messages.push(aiMsg);
      this.sending = true;
      this.scroll();
      try {
        const res = await fetch('http://localhost:8000/assist/chat', {
          method: 'POST', headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({ session_id: this.sessionId, case_id: this.caseId, message: text }),
        });
        const reader = res.body.getReader();
        const decoder = new TextDecoder();
        let buf = '';
        while (true) {
          const { done, value } = await reader.read();
          if (done) break;
          buf += decoder.decode(value, { stream: true });
          const parts = buf.split('\n\n');
          buf = parts.pop();
          for (const part of parts) {
            const ev = (part.match(/^event:(\w+)/m) || [])[1];
            const dataStr = (part.match(/^data:(.*)$/m) || [])[1];
            if (!ev || !dataStr) continue;
            const data = JSON.parse(dataStr);
            if (ev === 'start') this.sessionId = data.session_id;
            else if (ev === 'delta') { aiMsg.content += data.delta; this.scroll(); }
            else if (ev === 'citations') aiMsg.citations = data.citations;
            else if (ev === 'done') aiMsg.reply_id = data.reply_id;
            else if (ev === 'error') aiMsg.content = aiMsg.content || ('服务异常：' + (data.error && data.error.message));
          }
        }
      } catch (e) {
        aiMsg.content = aiMsg.content || ('请求失败：' + e.message);
      } finally {
        aiMsg.streaming = false;
        this.sending = false;
      }
    },
    async adopt(m, c) {
      await fetch('http://localhost:8000/assist/adopt', {
        method: 'POST', headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify({ case_id: this.caseId, from_reply_id: m.reply_id,
          citation_type: c.citation_type, ref_id: c.ref_id, content: c.content || c.title, target: 'similar_case_doc' }),
      });
      ElementPlus.ElMessage.success('已采纳到本案类案参考');
    },
    scroll() {
      this.$nextTick(() => {
        const el = this.$refs.chatList;
        if (el) el.scrollTop = el.scrollHeight;
      });
    },
  },
  mounted() { this.load(); this.loadCounts(); },
}).use(ElementPlus).mount('#app');
</script>
</body>
</html>
